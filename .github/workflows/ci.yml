name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 타입 검사와 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (세 사람이 한 판 완주)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @novapouch/web exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: |
            screenshots
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker 이미지 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t novapouch:ci .
      - name: 컨테이너 기동 확인
        run: |
          docker run -d --name np -p 8787:8787 novapouch:ci
          for _ in $(seq 1 30); do
            curl -fs http://localhost:8787/api/health && exit 0
            sleep 1
          done
          docker logs np
          exit 1
      - name: EC2 구성(Compose + Caddy)으로 기동 확인
        working-directory: deploy/aws/files
        run: |
          docker rm -f np
          printf 'DOMAIN=:80\nACCESS_CODE=ci-code\nAPP_BRAND=\nBACKUP_BUCKET=\n' > .env
          IMAGE=novapouch:ci docker compose up -d
          ok=""
          for _ in $(seq 1 30); do
            if curl -fs http://localhost/api/health; then ok=1; break; fi
            sleep 1
          done
          [ -n "$ok" ] || { docker compose logs; exit 1; }
          # 접근 코드가 .env에서 들어가고, Caddy가 /socket.io 경로를 넘기는지 확인한다
          curl -fs http://localhost/api/config | grep -q '"accessRequired":true'
          curl -fs "http://localhost/socket.io/?EIO=4&transport=polling" | grep -q '"sid"'
          docker compose down

  deploy-config:
    name: 배포 설정 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/aws/files/*.sh
      - run: pip install cfn-lint && cfn-lint deploy/aws/cloudformation.yaml
