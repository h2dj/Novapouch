name: Deploy

# main의 CI가 통과하면 이미지를 GHCR에 올리고, 설정돼 있으면 서버에 배포한다.
# 배포 대상은 저장소 변수 DEPLOY_TARGET(ec2 | fly)로 고른다.
# 자동 배포는 AUTO_DEPLOY=true 일 때만, 수동 실행(Run workflow)은 언제든 한다.
#   ec2: 변수 AWS_DEPLOY_ROLE_ARN, EC2_INSTANCE_ID (AWS_REGION 기본 ap-northeast-2) — docs/DEPLOY_EC2.md
#   fly: 시크릿 FLY_API_TOKEN — docs/DEPLOYMENT.md
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 진행 중인 게임이 있어도 배포하기
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    name: 이미지 게시 (GHCR)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ steps.sha.outputs.sha }}

  fly:
    name: Fly.io 배포
    needs: image
    if: vars.DEPLOY_TARGET == 'fly' && (vars.AUTO_DEPLOY == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.image.outputs.sha }}
      - name: 설정 확인
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN 시크릿이 없어 배포를 건너뜁니다. docs/DEPLOYMENT.md를 보세요."
            echo "skip=1" >> "$GITHUB_ENV"
          fi
      - name: 진행 중인 게임 확인
        if: env.skip != '1' && env.APP_URL != '' && inputs.force != true
        run: |
          active=$(curl -fsS "$APP_URL/api/health" | jq -r '.activeGames // 0' || echo 0)
          if [ "$active" != "0" ]; then
            echo "::warning::진행 중인 게임이 ${active}개 있어 배포를 미룹니다. 끝난 뒤 Deploy 워크플로를 수동으로 실행하세요."
            echo "skip=1" >> "$GITHUB_ENV"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.skip != '1'
      - name: 배포
        if: env.skip != '1'
        run: flyctl deploy --remote-only

  ec2:
    name: EC2 배포
    needs: image
    if: vars.DEPLOY_TARGET == 'ec2' && (vars.AUTO_DEPLOY == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      FORCE: ${{ inputs.force == true && '--force' || '' }}
    steps:
      - name: 설정 확인
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] || [ -z "$INSTANCE_ID" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN, EC2_INSTANCE_ID 변수가 필요합니다. docs/DEPLOY_EC2.md를 보세요."
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: 서버에서 update.sh 실행 (SSM Run Command)
        run: |
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "novapouch ${{ needs.image.outputs.sha }}" \
            --parameters "commands=['/opt/novapouch/update.sh $FORCE']" \
            --query Command.CommandId --output text)
          echo "명령 ID: $id"
          for _ in $(seq 1 60); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          out=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --output json)
          echo "$out" | jq -r '.StandardOutputContent, .StandardErrorContent'
          code=$(echo "$out" | jq -r '.ResponseCode')
          if [ "$code" = "3" ]; then
            echo "::warning::진행 중인 게임이 있어 배포를 미뤘습니다. 끝난 뒤 Deploy 워크플로를 수동으로 실행하세요."
            exit 0
          fi
          [ "$status" = "Success" ] || { echo "::error::업데이트 실패 (상태 $status, 종료 코드 $code)"; exit 1; }
