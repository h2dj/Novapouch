# EC2 서버의 /opt/novapouch 에서 실행하는 구성. 값은 같은 폴더의 .env에서 읽는다.
# 게임 서버(app)는 서버 안에서만 열고, 바깥 접속은 Caddy가 HTTPS로 받아 넘긴다.
services:
  app:
    image: ${IMAGE:-ghcr.io/h2dj/novapouch:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8787"
      DATA_DIR: /data
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
